version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tswc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4816027
      POSTGRES_DB: tswc
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: